name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish Folium.Desktop/Folium.Desktop.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o out/${{ matrix.rid }}

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out/${{ matrix.rid }}/* -DestinationPath Folium-${{ github.ref_name }}-${{ matrix.rid }}.zip

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        run: tar -czf Folium-${{ github.ref_name }}-${{ matrix.rid }}.tar.gz -C out/${{ matrix.rid }} .

      - uses: actions/upload-artifact@v4
        with:
          name: Folium-${{ github.ref_name }}-${{ matrix.rid }}
          path: Folium-${{ github.ref_name }}-${{ matrix.rid }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: 'Folium-*'
          generate_release_notes: true
